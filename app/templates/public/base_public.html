<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Коворкинг{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/availability-v2.css') }}" rel="stylesheet">
</head>
<body class="availability-page">
  {% block header %}
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__title">Коворкинг</div>
      <div class="site-header__row-mobile">
        <div class="site-header__logo">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="WORK — работа и общение" class="site-header__logo-img">
        </div>
        <div class="site-header__contacts">
          <div class="site-header__address">{{ site_address }}</div>
          <a href="tel:{{ site_phone | replace(' ', '') | replace('(', '') | replace(')', '') | replace('-', '') }}" class="site-header__phone">{{ site_phone }}</a>
        </div>
      </div>
    </div>
  </header>
  {% endblock %}
  <main class="availability-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
